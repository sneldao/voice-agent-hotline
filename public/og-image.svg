<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient — broker desk dark -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1917;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle amber glow from left -->
  <rect width="600" height="630" fill="url(#amberGlow)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.3" rx="16"/>

  <!-- Logo — amber circle with C -->
  <circle cx="100" cy="100" r="42" fill="url(#amber)"/>
  <text x="100" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0f172a" text-anchor="middle">C</text>

  <!-- Brand name -->
  <text x="160" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#f59e0b" letter-spacing="0.05em">Claflin</text>

  <!-- Title -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#fef3c7">Your broker is on the line</text>

  <!-- Tagline -->
  <text x="80" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#fcd34d" opacity="0.8">Call Hetty. Research tokenized stocks. Place paper trades by voice.</text>

  <!-- Features -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#f59e0b" opacity="0.9">Voice-first broker desk powered by ElevenLabs</text>
  <text x="80" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#f59e0b" opacity="0.9">Billed per minute in USDC on Arbitrum</text>
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#f59e0b" opacity="0.9">Confirmation before every move</text>

  <!-- URL -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#78716c">your-claflin-app.vercel.app</text>

  <!-- Decorative broker desk lines -->
  <line x1="950" y1="80" x2="950" y2="550" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="1000" y1="80" x2="1000" y2="550" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.08"/>
  <line x1="1050" y1="80" x2="1050" y2="550" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.06"/>

  <!-- Decorative amber dots -->
  <circle cx="950" cy="150" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="1000" cy="220" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="950" cy="300" r="4" fill="#f59e0b" opacity="0.4"/>
  <circle cx="1050" cy="380" r="4" fill="#f59e0b" opacity="0.3"/>
  <circle cx="1000" cy="450" r="4" fill="#f59e0b" opacity="0.2"/>
</svg>
